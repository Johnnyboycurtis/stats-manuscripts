<title>Spatial Data Analysis: A Linear Models and Matrix Approach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Layout: single reading column with a wrapped jump bar; part headings as ruled bands, chapters in serif, sections as an indented numbered outline. */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --fg:#1A2230; --muted:#5A6678;
  --rule:#D9DEE6; --accent:#1D5C8A; --accent-soft:#E3EEF7; --code:#EDF0F4;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161D; --surface:#171E27; --fg:#E3E8EF; --muted:#9AA6B6;
    --rule:#2A3441; --accent:#7DB8E6; --accent-soft:#1B2B3B; --code:#1E2733;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161D; --surface:#171E27; --fg:#E3E8EF; --muted:#9AA6B6;
  --rule:#2A3441; --accent:#7DB8E6; --accent-soft:#1B2B3B; --code:#1E2733;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--sans); font-size:16px; line-height:1.6;
  padding-block:32px 72px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:900px; margin:0 auto; min-width:0}
header.top{display:flex; flex-wrap:wrap; gap:16px 24px; align-items:flex-start; justify-content:space-between; padding-bottom:20px; border-bottom:2px solid var(--fg)}
header.top .titles{flex:1 1 420px; min-width:0}
.kicker{font-family:var(--mono); font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px}
h1{font-family:var(--serif); font-weight:600; font-size:clamp(1.7rem,4.5vw,2.45rem); line-height:1.15; margin:0; text-wrap:balance}
button.copy{font:inherit; font-size:.85rem; font-weight:500; color:var(--accent); background:var(--surface); border:1px solid var(--accent); border-radius:6px; padding:8px 14px; cursor:pointer}
button.copy:hover{background:var(--accent-soft)}
button.copy:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
nav.jump{display:flex; flex-wrap:wrap; gap:6px 8px; margin:18px 0 8px; padding:0}
nav.jump a{font-size:.8rem; color:var(--fg); text-decoration:none; background:var(--surface); border:1px solid var(--rule); border-radius:5px; padding:4px 10px}
nav.jump a:hover{border-color:var(--accent); color:var(--accent)}
#doc h2{font-family:var(--mono); font-size:.8rem; font-weight:500; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); margin:56px 0 4px; padding-top:14px; border-top:1px solid var(--rule); scroll-margin-top:16px}
#doc h3{font-family:var(--serif); font-weight:600; font-size:1.3rem; line-height:1.3; margin:32px 0 8px; text-wrap:balance; scroll-margin-top:16px}
#doc h1{display:none}
#doc p{margin:.6em 0; max-width:68ch}
#doc hr{border:0; border-top:1px solid var(--rule); margin:40px 0 0}
#doc ul,#doc ol{padding-left:1.3em; margin:.4em 0}
#doc li{margin:.18em 0; min-width:0}
#doc li>p{margin:.2em 0}
#doc ul.toc{list-style:none; padding-left:0}
#doc ul.toc ul{list-style:none; padding-left:1.4em; margin:.1em 0 .3em; border-left:1px solid var(--rule)}
#doc ul.toc>li{margin:.35em 0}
#doc ul.toc li li{font-size:.94rem; color:var(--fg)}
.num{font-family:var(--mono); font-size:.82em; color:var(--accent); margin-right:.5em; white-space:nowrap}
#doc em{font-style:italic}
#doc li em{color:var(--muted)}
#doc code{font-family:var(--mono); font-size:.86em; background:var(--code); padding:.08em .35em; border-radius:4px}
.tablewrap{overflow-x:auto; margin:14px 0; border:1px solid var(--rule); border-radius:6px; background:var(--surface)}
#doc table{border-collapse:collapse; width:100%; font-size:.9rem}
#doc th{font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-align:left; font-weight:500; padding:9px 12px; border-bottom:1px solid var(--rule); white-space:nowrap}
#doc td{padding:8px 12px; border-bottom:1px solid var(--rule); vertical-align:top}
#doc tr:last-child td{border-bottom:0}
#doc td:first-child{white-space:nowrap}
mjx-container{color:inherit}
mjx-container[display="true"]{display:block; overflow-x:auto; overflow-y:hidden; max-width:100%; margin:.7em 0}
details.src{margin-top:48px; border-top:1px solid var(--rule); padding-top:14px}
details.src summary{cursor:pointer; font-family:var(--mono); font-size:.8rem; color:var(--muted)}
details.src pre{overflow-x:auto; background:var(--code); padding:14px; border-radius:6px; font-family:var(--mono); font-size:.78rem; line-height:1.5; white-space:pre}
.fallback{white-space:pre-wrap; font-family:var(--mono); font-size:.8rem}
</style>

<div class="wrap">
  <header class="top">
    <div class="titles">
      <p class="kicker">Book outline &middot; final table of contents</p>
      <h1>Spatial Data Analysis: A Linear Models and Matrix Approach</h1>
    </div>
    <button class="copy" id="copybtn" type="button">Copy Markdown</button>
  </header>
  <nav class="jump" id="jump" aria-label="Sections"></nav>
  <main id="doc"><p class="fallback">Loading outline&hellip;</p></main>
  <details class="src" id="srcbox"><summary>Markdown source</summary><pre id="srcpre"></pre></details>
</div>

<script type="text/markdown" id="src">
